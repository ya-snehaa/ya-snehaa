name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main                  # change to master if that's your default branch

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs for ya-snehaa
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ya-snehaa
          outputs: |
            dist/github-snake.svg?color_snake=%236366f1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%23161b22,%230c2d48,%23145369,%231d8a99,%2322d3ee

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
